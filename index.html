<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>ToDo app</title>
</head>
<body>
    <div class="todo-container">
        <div class="add-task">
            <input type="text" name="" id="">
            <span class="plus">+</span>
        </div>
        <div class="tasks-content">
            <span class="no-tasks-message">No Tasks To Show</span>

        </div>
    </div>
    <div class="task-stats">
        <div class="tasks-count">Tasks <span>0</span></div>
        <div class="tasks-completed">Completed <span>0</span></div>
        <button class="delete-all">Delete All</button>
        <button class="all-finished">All Finished</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
